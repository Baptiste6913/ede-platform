[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ede-platform"
version = "0.1.0"
description = "Event-Driven Europe — M&A detection, scoring, and paper trading platform (FR/IT/DE)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Baptiste Bouault", email = "baptiste.bouault@gmail.com" }]
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "redis==5.2.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "structlog==24.4.0",
  "httpx==0.28.1",
  "typer==0.15.1",
  "feedparser==6.0.11",
  "pymupdf==1.23.26",
  "apscheduler==3.10.4",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "scikit-learn==1.5.2",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "joblib==1.4.2",
  # Dashboard (Phase 7 MVP)
  "streamlit==1.41.1",
  "plotly==5.24.1",
  # Trading (Phase 8 — IBKR paper)
  "ib_async==2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.2",
  "mypy==1.13.0",
  "pre-commit==4.0.1",
  "types-redis==4.6.0.20241004",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
  "artifacts",  # per-phase audit outputs + one-shot scripts; not production code
  "data",       # gitignored anyway
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "S",   # flake8-bandit
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "PLR0913", # too many arguments — domain models legitimately need many fields
  "S101",    # assert used — fine in tests
]

[tool.ruff.lint.per-file-ignores]
# N806: tests use `X` for feature matrices (sklearn / pandas convention).
# N802/N803: test fakes mirror external camelCase APIs (e.g. ib_async).
"tests/**/*.py" = ["S101", "PLR2004", "N806", "N802", "N803"]
# N803/N806: scoring module follows sklearn convention (X = features matrix).
"src/scoring/**/*.py" = ["N803", "N806"]
# Same convention for the scoring CLI runner.
"scripts/score_deals_run.py" = ["N806"]
# Streamlit single-file entry: relax page-function complexity + UI literals.
# Big-picture page handlers naturally exceed the default 12-branch / 50-stmt
# thresholds; magic-value thresholds (e.g. p≥0.85 for 5-star UI tier) are
# domain constants documented in docs/SCORING.md.
"streamlit_app.py" = ["PLR0912", "PLR0915", "PLR2004", "RUF001"]
# Step-0 diagnostic CLI: linear top-to-bottom script with prints, magic ports,
# and ✓/✗/○ status glyphs.
"scripts/ibkr_preflight.py" = ["PLR0915", "PLR2004", "RUF001"]
# Entry-point script: sys.path bootstrap before src imports (E402 expected).
"scripts/run_trading.py" = ["E402"]
# Audit CLI: same sys.path bootstrap before src imports (E402 expected).
"scripts/audit_offer_price.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["fitz", "feedparser", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bs4", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ib_async", "ib_async.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "pandas", "pandas.*"]
ignore_missing_imports = true

# The scoring module relies heavily on dynamically typed sklearn /
# pandas / numpy. We accept Any-leaning return types and untyped
# inner helpers there for V1; full type hardening lands in phase 7+.
[[tool.mypy.overrides]]
module = ["src.scoring.*"]
disallow_untyped_calls = false
disallow_any_explicit = false
warn_return_any = false
disable_error_code = ["type-arg", "no-any-return", "assignment"]

# Dashboard module — same rationale (pandas / plotly heavy).
[[tool.mypy.overrides]]
module = ["src.dashboard.*"]
warn_return_any = false
disable_error_code = ["no-any-return", "type-arg"]

# Trading module — ib_async is untyped (Any-leaning broker SDK); we keep our
# own SDK-free dataclasses at the boundary and accept Any from the broker layer.
[[tool.mypy.overrides]]
module = ["src.trading.*"]
warn_return_any = false
disable_error_code = ["no-any-return", "type-arg"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "streamlit"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Per-test event loops keep asyncpg connections bound to the right loop.
# Migrations are run once via subprocess (sync) in tests/conftest._migrate_once.
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore:.*strip_cdata.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/cli/__init__.py", "src/*/main.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
