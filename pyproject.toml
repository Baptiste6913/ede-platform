[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ede-platform"
version = "0.1.0"
description = "Event-Driven Europe — M&A detection, scoring, and paper trading platform (FR/IT/DE)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Baptiste Bouault", email = "baptiste.bouault@gmail.com" }]
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "redis==5.2.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "structlog==24.4.0",
  "httpx==0.28.1",
  "typer==0.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.2",
  "mypy==1.13.0",
  "pre-commit==4.0.1",
  "types-redis==4.6.0.20241004",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "S",   # flake8-bandit
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "PLR0913", # too many arguments — domain models legitimately need many fields
  "S101",    # assert used — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Per-test event loops keep asyncpg connections bound to the right loop.
# Migrations are run once via subprocess (sync) in tests/conftest._migrate_once.
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/cli/__init__.py", "src/*/main.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
